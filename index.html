<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080c12">
<title>MAXNET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080c12;
  --card:#0f151e;
  --card2:#111923;
  --line:#1d2733;
  --text:#f5f7fa;
  --muted:#8995a5;
  --blue:#1264ff;
  --blue2:#3180ff;
  --danger:#ff3040;
  --green:#27d17f;
  --shadow:0 12px 40px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overscroll-behavior-y:none;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  min-height:100vh;
}

.screen{
  min-height:100vh;
  padding-bottom:82px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(8,12,18,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue);
}

.icon-btn{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border-radius:12px;
}

.icon-btn:active{
  background:#151d28;
}

.icon{
  width:22px;
  height:22px;
  stroke:currentColor;
  stroke-width:1.8;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
}

.page{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.btn{
  min-height:46px;
  border-radius:13px;
  padding:0 17px;
  background:#151e29;
  color:#fff;
  font-weight:700;
}

.btn.primary{
  background:var(--blue);
}

.btn.primary:active{
  background:#0b55df;
}

.btn.danger{
  background:#251219;
  color:#ff6672;
}

.btn.full{
  width:100%;
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:#0b1118;
  color:#fff;
  border-radius:13px;
  padding:14px;
}

.input:focus,
.textarea:focus{
  border-color:#246eff;
}

.textarea{
  min-height:110px;
  resize:none;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.title{
  font-size:25px;
  font-weight:900;
  margin:4px 0 6px;
}

.subtitle{
  color:var(--muted);
  line-height:1.45;
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0,rgba(18,100,255,.18),transparent 38%),
    var(--bg);
}

.auth-box{
  width:100%;
  max-width:420px;
}

.auth-logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.auth-logo span{
  color:var(--blue);
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}

.auth-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
  background:#0a1017;
  border-radius:12px;
  margin-bottom:18px;
}

.auth-tab{
  padding:11px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-weight:700;
}

.auth-tab.active{
  background:#172230;
  color:#fff;
}

.form-group{
  margin-bottom:12px;
}

.form-label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.auth-error{
  color:#ff6570;
  font-size:13px;
  margin:10px 0;
}

/* STORIES */

.stories-wrap{
  padding:12px 0 8px;
  border-bottom:1px solid var(--line);
  overflow:hidden;
}

.stories{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 16px 5px;
  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story-item{
  flex:0 0 66px;
  text-align:center;
}

.story-ring{
  width:64px;
  height:64px;
  padding:2px;
  border-radius:50%;
  background:linear-gradient(135deg,#1264ff,#7c3cff,#ff2f78);
}

.story-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#111923;
  padding:2px;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#17202c;
}

.story-name{
  display:block;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  color:#dce2e9;
}

.add-story{
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px dashed #344354;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0c131b;
}

.add-story .icon{
  color:var(--blue);
}

/* FEED */

.feed{
  padding-bottom:20px;
}

.post{
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:10px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
}

.post-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#18212c;
}

.post-user{
  min-width:0;
  flex:1;
}

.post-username{
  font-weight:800;
  font-size:14px;
}

.post-time{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.media-wrap{
  width:100%;
  background:#05080c;
  position:relative;
}

.media-wrap img,
.media-wrap video{
  width:100%;
  max-height:680px;
  display:block;
  object-fit:contain;
  background:#05080c;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:4px;
  padding:7px 10px 0;
}

.action{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:transparent;
}

.action:active{
  background:#151d27;
}

.action.liked{
  color:var(--danger);
}

.action.saved{
  color:var(--blue);
}

.action svg{
  width:22px;
  height:22px;
}

.post-info{
  padding:0 16px;
}

.likes{
  font-weight:800;
  font-size:13px;
  margin:2px 0 7px;
}

.caption{
  line-height:1.4;
  font-size:14px;
}

.caption b{
  margin-right:5px;
}

.comments-link{
  color:var(--muted);
  margin-top:8px;
  font-size:13px;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

/* VERIFIED */

.verified-badge{
  display:inline-flex;
  width:17px;
  height:17px;
  margin-left:4px;
  color:#1264ff;
  vertical-align:-3px;
  flex:none;
}

.verified-badge svg{
  width:100%;
  height:100%;
  display:block;
}

.verified-name{
  display:inline-flex;
  align-items:center;
}

.verify-hero{
  text-align:center;
  padding:25px 10px 20px;
}

.verify-icon{
  width:82px;
  height:82px;
  margin:0 auto 18px;
  color:#1264ff;
}

.verify-icon svg{
  width:100%;
  height:100%;
}

.verify-account{
  margin-top:18px;
  padding:15px;
  border:1px solid var(--line);
  background:#0b1118;
  border-radius:15px;
  text-align:left;
}

.verify-account-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.verify-account-name{
  font-size:16px;
  font-weight:800;
}

.verify-progress{
  margin-top:18px;
  height:7px;
  background:#17212d;
  border-radius:99px;
  overflow:hidden;
}

.verify-progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#1264ff,#3180ff);
  border-radius:99px;
  transition:width .5s ease;
}

.verify-status{
  margin-top:13px;
  min-height:20px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:70px;
  background:rgba(8,12,18,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  background:transparent;
  color:#7d8998;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:4px;
  font-size:10px;
}

.nav-btn.active{
  color:#fff;
}

.nav-btn.active .icon{
  color:var(--blue);
}

.nav-btn .icon{
  width:21px;
  height:21px;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:14px;
}

.search-box .icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-box input{
  padding-left:43px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 4px;
}

.user-row-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.user-row-main{
  flex:1;
  min-width:0;
}

.user-row-name{
  font-weight:800;
}

.user-row-username{
  color:var(--muted);
  font-size:13px;
}

/* PROFILE */

.profile-head{
  padding:20px 16px;
}

.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.profile-main{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:20px;
  font-weight:900;
}

.profile-username{
  color:var(--muted);
  margin-top:3px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.stat{
  text-align:center;
}

.stat-number{
  font-weight:900;
  font-size:17px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.profile-bio{
  margin-top:16px;
  line-height:1.45;
  white-space:pre-wrap;
}

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.profile-buttons .btn{
  flex:1;
}

.grid-posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.grid-item{
  aspect-ratio:1;
  background:#0e151d;
  overflow:hidden;
  position:relative;
}

.grid-item img,
.grid-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-mark{
  position:absolute;
  top:8px;
  right:8px;
  width:25px;
  height:25px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
}

/* CREATE */

.create-preview{
  margin-top:14px;
  border-radius:16px;
  overflow:hidden;
  background:#05080c;
}

.create-preview img,
.create-preview video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain;
}

.file-picker{
  position:relative;
  border:1px dashed #344354;
  border-radius:15px;
  padding:20px;
  text-align:center;
  background:#0b1118;
}

.file-picker input{
  width:100%;
}

/* SETTINGS */

.settings-section{
  margin-top:20px;
}

.settings-title{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  margin:0 0 8px 4px;
}

.settings-card{
  overflow:hidden;
}

.setting-row{
  width:100%;
  min-height:57px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 14px;
  background:transparent;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#151f2b;
}

.setting-content{
  flex:1;
}

.setting-name{
  font-weight:700;
  font-size:14px;
}

.setting-desc{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.chevron{
  color:#657384;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#0d141d;
  border:1px solid var(--line);
  border-radius:22px 22px 0 0;
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-title{
  font-weight:900;
  font-size:19px;
}

/* COMMENTS */

.comment{
  display:flex;
  gap:9px;
  margin-bottom:14px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.comment-body{
  flex:1;
  background:#121a24;
  padding:9px 11px;
  border-radius:12px;
}

.comment-user{
  font-weight:800;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
  font-size:13px;
  line-height:1.4;
}

/* CHAT */

.chat-list{
  padding:4px 0;
}

.chat-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line);
}

.chat-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.chat-main{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:800;
}

.chat-preview{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.messages{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:7px;
  min-height:calc(100vh - 145px);
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:15px;
  font-size:14px;
  line-height:1.4;
}

.message.mine{
  align-self:flex-end;
  background:var(--blue);
  border-bottom-right-radius:4px;
}

.message.theirs{
  align-self:flex-start;
  background:#151e29;
  border-bottom-left-radius:4px;
}

.chat-input{
  position:fixed;
  bottom:70px;
  left:0;
  right:0;
  background:#0a1017;
  border-top:1px solid var(--line);
  padding:9px;
  display:flex;
  gap:7px;
  z-index:80;
}

.chat-input input{
  flex:1;
}

/* REELS */

.reels{
  height:calc(100vh - 62px - 70px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:#000;
}

.reel{
  height:100%;
  min-height:100%;
  scroll-snap-align:start;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.reel-info{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  z-index:3;
  text-shadow:0 2px 8px #000;
}

.reel-user{
  font-weight:900;
  margin-bottom:7px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:1000;
  background:#151e29;
  border:1px solid #2a3849;
  padding:11px 15px;
  border-radius:12px;
  font-size:13px;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* STORY VIEW */

.story-view{
  position:fixed;
  inset:0;
  z-index:900;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-view img,
.story-view video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.story-top{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
}

.story-top .avatar{
  width:38px;
  height:38px;
}

.story-top-info{
  flex:1;
}

.story-close{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
}

.story-bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:25px;
  z-index:5;
  display:flex;
  gap:8px;
}

.story-bottom input{
  flex:1;
}

@media(min-width:700px){
  .bottom{
    max-width:720px;
    left:50%;
    transform:translateX(-50%);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
}
</style>
</head>

<script>

const SUPABASE_URL = "https://mfigwskkkeiakqfstrvv.supabase.co";
const SUPABASE_KEY = "sb_publishable_jIhgKUo_Z_a-dUvmTaYsdQ_JnFhOy7P";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const app = document.getElementById("app");

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let currentChatId = null;
let currentChatUser = null;
let currentProfileUser = null;
let currentStory = null;
let realtimeChannels = [];

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el = $("toast");
  if(!el) return;

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast = setTimeout(
    () => el.classList.remove("show"),
    2500
  );
}

function timeAgo(date){
  const diff = Date.now() - new Date(date).getTime();

  const m = Math.floor(diff / 60000);

  if(m < 1) return "сейчас";

  if(m < 60) return m + " мин";

  const h = Math.floor(m / 60);

  if(h < 24) return h + " ч";

  const d = Math.floor(h / 24);

  if(d < 7) return d + " д";

  return new Date(date).toLocaleDateString("ru-RU");
}

function getAvatar(profile){
  return profile?.avatar_url ||

async function login(){

  const email = $("authEmail")?.value.trim();
  const password = $("authPassword")?.value;

  if(!email || !password){
    $("authError").textContent =
      "Заполни email и пароль";
    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    $("authError").textContent =
      error.message;
    return;
  }

  currentUser = data.user;

  await loadProfile();

  saveAccountSession();

  await showHome();
}

async function register(){

  const email =
    $("authEmail")?.value.trim();

  const password =
    $("authPassword")?.value;

  const usernameRaw =
    $("authUsername")?.value.trim().toLowerCase();

  const display =
    $("authDisplay")?.value.trim();

  const username =
    usernameRaw
      .replace(/^@/,"")
      .replace(/[^a-z0-9_.]/g,"");

  if(!email || !password || !username){
    $("authError").textContent =
      "Заполни обязательные поля";
    return;
  }

  if(username.length < 3){
    $("authError").textContent =
      "Username должен быть минимум 3 символа";
    return;
  }

  if(password.length < 6){
    $("authError").textContent =
      "Пароль должен быть минимум 6 символов";
    return;
  }

  const {data,error} =
    await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          username,
          display_name:display || username
        }
      }
    });

  if(error){
    $("authError").textContent =
      error.message;
    return;
  }

  if(data.user){

    currentUser = data.user;

    await loadProfile();

    if(!currentProfile){

      await db.from("profiles").upsert({
        id:data.user.id,
        username,
        display_name:display || username
      });

      await loadProfile();
    }

    toast("Аккаунт создан");

    saveAccountSession();

    await showHome();
  }
}

async function loadProfile(){

  if(!currentUser) return null;

  const {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return null;
  }

  currentProfile = data;

  return data;
}

/* =========================================================
   ACCOUNT MANAGER
========================================================= */

const ACCOUNTS_KEY =
  "maxnet_accounts_v1";

function getSavedAccounts(){

  try{
    return JSON.parse(
      localStorage.getItem(ACCOUNTS_KEY) || "[]"
    );
  }catch{
    return [];
  }
}

function saveAccountSession(){

  if(!currentUser) return;

  db.auth.getSession().then(({data})=>{

    const session = data.session;

    if(!session) return;

    const accounts =
      getSavedAccounts();

    const item = {
      user_id:currentUser.id,
      email:currentUser.email || "",
      username:currentProfile?.username || "",
      display_name:currentProfile?.display_name || "",
      avatar_url:currentProfile?.avatar_url || "",
      access_token:session.access_token,
      refresh_token:session.refresh_token
    };

    const filtered =
      accounts.filter(
        a => a.user_id !== item.user_id
      );

    filtered.unshift(item);

    localStorage.setItem(
      ACCOUNTS_KEY,
      JSON.stringify(filtered.slice(0,7))
    );
  });
}

async function switchAccount(userId){

  const account =
    getSavedAccounts()
      .find(a => a.user_id === userId);

  if(!account) return;

  const {error} =
    await db.auth.setSession({
      access_token:account.access_token,
      refresh_token:account.refresh_token
    });

  if(error){
    toast("Сессия устарела");
    return;
  }

  const {data} =
    await db.auth.getUser();

  if(data.user){

    currentUser = data.user;

    await loadProfile();

    await showHome();
  }
}

async function loadFeed(){

  const feed = $("feed");

  if(!feed) return;

  const {data:posts,error} =
    await db
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url,
          is_verified
        ),
        post_media(
          id,
          media_url,
          media_type,
          sort_order
        )
      `)
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty">
        Не удалось загрузить публикации
      </div>`;

    return;
  }

  if(!posts?.length){

    feed.innerHTML = `
      <div class="empty">

        <div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:7px">
          Пока нет публикаций
        </div>

        <div>
          Создай первую публикацию.
        </div>

      </div>
    `;

    return;
  }

  feed.innerHTML =
    posts.map(renderPost).join("");
}

function renderPost(post){

  const profile = post.profiles;

  const media =
    (post.post_media || [])
      .sort(

          (a.sort_order||0)-
          (b.sort_order||0)

  const first = media[0];

  if(!first) return "";

  const mediaHtml =
    first.media_type === "video"

    ? `
      <video
        src="${esc(first.media_url)}"
        controls
        playsinline
        preload="metadata">
      </video>
    `

    : `
      <img
        src="${esc(first.media_url)}"
        loading="lazy">
    `;

  return `

    <article
      class="post"
      id="post-${post.id}">

      <div class="post-head">

        <img
          class="post-avatar"
          src="${esc(getAvatar(profile))}"
          onclick="showProfile('${post.user_id}')">

        <div
          class="post-user"
          onclick="showProfile('${post.user_id}')">

          <div class="post-username verified-name">

            ${esc(
              profile?.display_name ||
              profile?.username ||
              "Пользователь"
            )}

            ${verifiedBadge(profile)}

          </div>

          <div class="post-time">

            @${esc(profile?.username || "")}
            ·
            ${timeAgo(post.created_at)}

          </div>

        </div>

      </div>

      <div class="media-wrap">
        ${mediaHtml}
      </div>

      <div class="post-actions">

        <button
          class="action"
          onclick="toggleLike('${post.id}',this)">
          ${icon("heart")}
        </button>

        <button
          class="action"
          onclick="openComments('${post.id}')">
          ${icon("comment")}
        </button>

        <button
          class="action"
          onclick="sharePost('${post.id}')">
          ${icon("send")}
        </button>

        <button
          class="action"
          onclick="toggleSave('${post.id}',this)">
          ${icon("bookmark")}
        </button>

      </div>

      <div class="post-info">

        <div class="likes">
          ${Number(post.likes_count || 0)}
          отметок нравится
        </div>

        ${post.caption ? `

          <div class="caption">

            <b>
              @${esc(profile?.username || "")}
            </b>

            ${esc(post.caption)}

          </div>

        ` : ""}

        ${Number(post.comments_count || 0) > 0 ? `

          <div
            class="comments-link"
            onclick="openComments('${post.id}')">

            Посмотреть комментарии
            (${post.comments_count})

          </div>

        ` : ""}

      </div>

    </article>
  `;
}

async function loadStories(){

  const box = $("stories");

  if(!box) return;

  const now =
    new Date().toISOString();

  const {data,error} =
    await db
      .from("stories")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url,
          is_verified
        )
      `)
      .gt("expires_at",now)
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    box.innerHTML = `

      <div class="story-item">

        <button
          class="add-story"
          onclick="showCreateStory()">

          ${icon("plus")}

        </button>

        <span class="story-name">
          Ваша история
        </span>

      </div>

    `;

    return;
  }

  const grouped = new Map();

  for(const story of data || []){

    if(!grouped.has(story.user_id)){
      grouped.set(
        story.user_id,
        story
      );
    }
  }

  let html = `

    <div class="story-item">

      <button
        class="add-story"
        onclick="showCreateStory()">

        ${icon("plus")}

      </button>

      <span class="story-name">
        Ваша история
      </span>

    </div>
  `;

  html +=
    [...grouped.values()]
      .map(story=>`

        <div
          class="story-item"
          onclick="openStory('${story.id}')">

          <div class="story-ring">

            <div class="story-inner">

              <img
                class="avatar"
                src="${esc(
                  getAvatar(story.profiles)
                )}">

            </div>

          </div>

          <span class="story-name verified-name">

            ${esc(
              story.profiles?.username ||
              "user"
            )}

            ${verifiedBadge(story.profiles)}

          </span>

        </div>

      `)
      .join("");

  box.innerHTML = html;
}

function previewStory(e){

  const file =
    e.target.files?.[0];

  if(!file) return;

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const url =
    URL.createObjectURL(file);

  const preview =
    $("storyPreview");

  preview.classList.remove("hidden");

  preview.innerHTML =
    isVideo

    ? `
      <video
        src="${url}"
        controls
        playsinline>
      </video>
    `

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const isImage =
    file.type.startsWith("image/") ||
    ["jpg","jpeg","png","webp"].includes(ext);

  if(!isVideo && !isImage){
    toast("Этот формат не поддерживается");
    return;
  }

  const path =
    `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

  toast("Загрузка...");

  const {error:uploadError} =
    await db.storage
      .from("stories")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type || undefined
        }
      );

  if(uploadError){

    console.error(uploadError);

    toast("Ошибка загрузки");

    return;
  }

  const {data:urlData} =
    db.storage
      .from("stories")
      .getPublicUrl(path);

  const expires =
    new Date(
      Date.now() +
      24*60*60*1000
    ).toISOString();

  const {error} =
    await db
      .from("stories")
      .insert({
        user_id:currentUser.id,
        media_url:urlData.publicUrl,
        media_type:
          isVideo ? "video" : "image",
        expires_at:expires
      });

  if(error){

    console.error(error);

    toast("Ошибка создания истории");

    return;
  }

  toast("История опубликована");

  await showHome();
}

function previewPostFiles(e){

  const files =
    [...(e.target.files || [])];

  const box =
    $("postPreview");

  if(!files.length){

    box.classList.add("hidden");

    return;
  }

  box.classList.remove("hidden");

  box.innerHTML =
    files.map(file=>{

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const isVideo =
        file.type.startsWith("video/") ||
        ["mp4","webm"].includes(ext);

      const url =
        URL.createObjectURL(file);

      return isVideo

        ? `
          <video
            src="${url}"
            controls
            playsinline>
          </video>
        `

        : `
          <img src="${url}">
        `;

    }).join("");
}

function getFileType(file){

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const isImage =
    file.type.startsWith("image/") ||
    ["jpg","jpeg","png","webp"].includes(ext);

  if(isVideo) return "video";

  if(isImage) return "image";

  return null;
}

async function publishPost(){

  const files =
    [...($("postFile")?.files || [])];

  const caption =
    $("postCaption")?.value.trim() || "";

  if(!files.length){

    toast("Выбери фото или видео");

    return;
  }

  if(files.length > 10){

    toast("Максимум 10 файлов");

    return;
  }

  const types =
    files.map(getFileType);

  if(types.some(x=>!x)){

    toast("Есть неподдерживаемый файл");

    return;
  }

  toast("Создание публикации...");

  const {data:post,error:postError} =
    await db
      .from("posts")
      .insert({
        user_id:currentUser.id,
        caption
      })
      .select()
      .single();

  if(postError){

    console.error(postError);

    toast("Ошибка создания публикации");

    return;
  }

  for(let i=0;i<files.length;i++){

    const file =
      files[i];

    const mediaType =
      types[i];

    const ext =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const path =
      `${currentUser.id}/${post.id}/${crypto.randomUUID()}.${ext}`;

    const {error:uploadError} =
      await db.storage
        .from("posts")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:
              file.type || undefined
          }
        );

    if(uploadError){

      console.error(uploadError);

      await db
        .from("posts")
        .delete()
        .eq("id",post.id);

      toast("Ошибка загрузки файла");

      return;
    }

    const {data:urlData} =
      db.storage
        .from("posts")
        .getPublicUrl(path);

    const {error:mediaError} =
      await db
        .from("post_media")
        .insert({
          post_id:post.id,
          media_url:urlData.publicUrl,
          media_type:mediaType,
          sort_order:i
        });

    if(mediaError){

      console.error(mediaError);

      await db
        .from("posts")
        .delete()
        .eq("id",post.id);

      toast("Ошибка сохранения медиа");

      return;
    }
  }

  toast("Публикация опубликована");

  await showHome();
}

function debounce(fn,delay){

  let timer;

  return (...args)=>{

    clearTimeout(timer);

    timer =
      setTimeout(
        ()=>fn(...args),
        delay
      );
  };
}

async function searchUsers(){

  const raw =
    $("searchInput")?.value.trim();

  if(!raw){

    $("searchResults").innerHTML = "";

    return;
  }

  const q =
    raw
      .replace(/^@/,"")
      .replace(/[%_]/g,"");

  if(!q) return;

  const {data,error} =
    await db
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        is_verified
      `)
      .or(
        `username.ilike.%${q}%,display_name.ilike.%${q}%`
      )
      .limit(30);

  if(error){

    console.error(error);

    return;
  }

  const box =
    $("searchResults");

  if(!data?.length){

    box.innerHTML =
      `<div class="empty">

      </button>

  `);

async function saveProfile(){

  let username =
    $("editUsername")
      ?.value
      .trim()
      .toLowerCase();

  username =
    username
      .replace(/^@/,"")
      .replace(/[^a-z0-9_.]/g,"");

  const display =
    $("editDisplay")?.value.trim();

  const bio =
    $("editBio")?.value.trim();

  const avatar =
    $("avatarFile")
      ?.files?.[0];

  if(username.length < 3){

    toast("Username слишком короткий");

    return;
  }

  let avatarUrl =
    currentProfile?.avatar_url ||
    null;

  if(avatar){

    const ext =
      avatar.name
        .split(".")
        .pop()
        .toLowerCase() ||
      "jpg";

    const path =
      `${currentUser.id}/avatar.${ext}`;

    const {error:uploadError} =
      await db.storage
        .from("avatars")
        .upload(
          path,
          avatar,
          {
            upsert:true,
            contentType:
              avatar.type ||
              "image/jpeg"
          }
        );

    if(uploadError){

      console.error(uploadError);

      toast("Ошибка аватара");

      return;
    }

    const {data:urlData} =
      db.storage
        .from("avatars")
        .getPublicUrl(path);

    avatarUrl =
      urlData.publicUrl +
      "?v=" +
      Date.now();
  }

  const {error} =
    await db
      .from("profiles")
      .update({
        username,
        display_name:
          display || username,
        bio,
        avatar_url:avatarUrl,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        currentUser.id
      );

  if(error){

    console.error(error);

    toast("Ошибка сохранения");

    return;
  }

  await loadProfile();

  saveAccountSession();

  toast("Профиль сохранён");

  await showProfile(
    currentUser.id
  );
}

            )}
          </div>

        </div>

      </section>

    `).join("");

  const videos =
    $("reels")
      .querySelectorAll("video");

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          if(entry.isIntersecting){

async function loadMessages(){

    await db
      .from("messages")
      .select("*")
      .eq(
        "chat_id",

      .order(

    box.innerHTML =
      `<div class="empty">

    return;
  }

  box.innerHTML =
    (data || [])
      .map(m=>`

        <div
          class="message ${
            m.sender_id===currentUser.id
              ? "mine"
              : "theirs"

async function sendMessage(){

  const input =
    $("messageInput");

  const content =
    input?.value.trim();

  if(!content || !currentChatId)
    return;

  const {error} =
    await db
      .from("messages")
      .insert({
        chat_id:currentChatId,
        sender_id:currentUser.id,
        content,
        media_type:null
      });

  if(error){

    console.error(error);

    toast("Не удалось отправить");

    return;
  }

  input.value = "";

  await loadMessages();
}

async function startVerification(){

  const button =
    $("verifyButton");

  const process =
    $("verifyProcess");

  const bar =
    $("verifyProgressBar");

  const status =
    $("verifyStatus");

  if(
    !button ||
    !process ||
    !bar ||
    !status
  ) return;

  button.disabled = true;
  button.style.opacity = ".55";

  process.classList.remove("hidden");

  const steps = [

    [
      "Проверяем аккаунт...",
      15
    ],

    [
      "Проверяем профиль...",
      35
    ],

    [
      "Проверяем данные MAXNET...",
      58
    ],

    [
      "Активируем Verified...",
      82
    ]

  ];

  for(const [text,percent] of steps){

    status.textContent =
      text;

    bar.style.width =
      percent + "%";

    await new Promise(
      resolve =>
        setTimeout(resolve,700)
    );
  }

  const {data,error} =
    await db.rpc(
      "claim_verified"
    );

  if(error || data !== true){

    console.error(error);

    status.textContent =
      "Не удалось активировать Verified.";

    bar.style.width =
      "0%";

    button.disabled =
      false;

    button.style.opacity =
      "1";

    toast(
      "Ошибка активации Verified"
    );

    return;
  }

  bar.style.width =
    "100%";

  status.textContent =
    "Verified успешно активирован";

  await loadProfile();

  saveAccountSession();

  await new Promise(
    resolve =>
      setTimeout(resolve,700)
  );

  toast(
    "MAXNET Verified активирован"
  );

  await showProfile(
    currentUser.id
  );
}

                  )}

                </div>

                <div class="user-row-username">

                  ${text}
                  ·
                  ${timeAgo(n.created_at)}

                </div>

              </div>

            </div>
          `;

        }).join("")

        : `

          <div class="empty">
            Пока нет уведомлений.
          </div>

        `
      }

    </div>
  `;

  document.body.appendChild(modal);

  await db
    .from("notifications")
    .update({
      is_read:true
    })
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );
}

async function openNotification(
  type,
  postId,
  storyId
){

  $("notificationsModal")
    ?.remove();

  if(
    type==="story_like" &&
    storyId
  ){

    await openStory(storyId);

    return;
  }

  if(
    type==="post_like" &&
    postId
  ){

    await showHome();

    setTimeout(()=>{

      document
        .getElementById(
          "post-"+postId
        )
        ?.scrollIntoView({
          behavior:"smooth"
        });

    },300);
  }
}

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

  realtimeChannels.forEach(c=>{

    try{
      db.removeChannel(c);
    }catch{}

  });

  realtimeChannels = [];

  const feedChannel =
    db.channel("maxnet-feed");

  feedChannel

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      ()=>{

        if(currentPage==="home"){
          loadFeed();
        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"post_likes"
      },
      ()=>{

        if(currentPage==="home"){
          loadFeed();
        }

      }
    )

    .subscribe();

  realtimeChannels.push(
    feedChannel
  );

  const messageChannel =
    db.channel("maxnet-messages");

  messageChannel

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{

        if(
          currentChatId &&
          payload.new.chat_id ===
          currentChatId
        ){

          loadMessages();
        }

      }
    )

    .subscribe();

  realtimeChannels.push(
    messageChannel
  );
}

/* =========================================================
   NAVIGATION
========================================================= */

function goBack(){

  if(currentPage==="settings"){

    showProfile(
      currentUser.id
    );

    return;
  }

  if(currentPage==="create"){

    showHome();

    return;
  }

  if(currentPage==="search"){

    showHome();

    return;
  }

  showHome();
}

/* =========================================================
   SESSION INIT
========================================================= */

async function init(){

  const {data} =
    await db.auth.getSession();

  if(data.session?.user){

    currentUser =
      data.session.user;

    await loadProfile();

    if(!currentProfile){

      const username =
        currentUser
          .user_metadata
          ?.username ||
        (
          "user_" +
          currentUser.id.slice(0,8)
        );

      await db
        .from("profiles")
        .upsert({
          id:currentUser.id,
          username,
          display_name:
            currentUser
              .user_metadata
              ?.display_name ||
            username
        });

      await loadProfile();
    }

    saveAccountSession();

    await showHome();

  }else{

    authScreen("login");
  }

  db.auth.onAuthStateChange(
    async(event,session)=>{

      if(event==="SIGNED_OUT"){

        currentUser = null;

        currentProfile = null;

        authScreen("login");
      }

      if(
        event==="TOKEN_REFRESHED" &&
        session
      ){

        saveAccountSession();
      }

    }
  );
}

init();
</script>
