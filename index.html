<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080c12">
<title>MAXNET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080c12;
  --card:#0f151e;
  --card2:#111923;
  --line:#1d2733;
  --text:#f5f7fa;
  --muted:#8995a5;
  --blue:#1264ff;
  --blue2:#3180ff;
  --danger:#ff3040;
  --green:#27d17f;
  --shadow:0 12px 40px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overscroll-behavior-y:none;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  min-height:100vh;
}

.screen{
  min-height:100vh;
  padding-bottom:82px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(8,12,18,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--blue);
}

.icon-btn{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border-radius:12px;
}

.icon-btn:active{
  background:#151d28;
}

.icon{
  width:22px;
  height:22px;
  stroke:currentColor;
  stroke-width:1.8;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
}

.page{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.btn{
  min-height:46px;
  border-radius:13px;
  padding:0 17px;
  background:#151e29;
  color:#fff;
  font-weight:700;
}

.btn.primary{
  background:var(--blue);
}

.btn.primary:active{
  background:#0b55df;
}

.btn.danger{
  background:#251219;
  color:#ff6672;
}

.btn.full{
  width:100%;
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:#0b1118;
  color:#fff;
  border-radius:13px;
  padding:14px;
}

.input:focus,
.textarea:focus{
  border-color:#246eff;
}

.textarea{
  min-height:110px;
  resize:none;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.title{
  font-size:25px;
  font-weight:900;
  margin:4px 0 6px;
}

.subtitle{
  color:var(--muted);
  line-height:1.45;
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0,rgba(18,100,255,.18),transparent 38%),
    var(--bg);
}

.auth-box{
  width:100%;
  max-width:420px;
}

.auth-logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.auth-logo span{
  color:var(--blue);
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}

.auth-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
  background:#0a1017;
  border-radius:12px;
  margin-bottom:18px;
}

.auth-tab{
  padding:11px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-weight:700;
}

.auth-tab.active{
  background:#172230;
  color:#fff;
}

.form-group{
  margin-bottom:12px;
}

.form-label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.auth-error{
  color:#ff6570;
  font-size:13px;
  margin:10px 0;
}

/* STORIES */

.stories-wrap{
  padding:12px 0 8px;
  border-bottom:1px solid var(--line);
  overflow:hidden;
}

.stories{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 16px 5px;
  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story-item{
  flex:0 0 66px;
  text-align:center;
}

.story-ring{
  width:64px;
  height:64px;
  padding:2px;
  border-radius:50%;
  background:linear-gradient(135deg,#1264ff,#7c3cff,#ff2f78);
}

.story-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#111923;
  padding:2px;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#17202c;
}

.story-name{
  display:block;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  color:#dce2e9;
}

.add-story{
  width:64px;
  height:64px;
  border-radius:50%;
  border:1px dashed #344354;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0c131b;
}

.add-story .icon{
  color:var(--blue);
}

/* FEED */

.feed{
  padding-bottom:20px;
}

.post{
  border-bottom:1px solid var(--line);
  padding-bottom:16px;
  margin-bottom:10px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
}

.post-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#18212c;
}

.post-user{
  min-width:0;
  flex:1;
}

.post-username{
  font-weight:800;
  font-size:14px;
}

.post-time{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.media-wrap{
  width:100%;
  background:#05080c;
  position:relative;
}

.media-wrap img,
.media-wrap video{
  width:100%;
  max-height:680px;
  display:block;
  object-fit:contain;
  background:#05080c;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:4px;
  padding:7px 10px 0;
}

.action{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:transparent;
}

.action:active{
  background:#151d27;
}

.action.liked{
  color:var(--danger);
}

.action.saved{
  color:var(--blue);
}

.action svg{
  width:22px;
  height:22px;
}

.post-info{
  padding:0 16px;
}

.likes{
  font-weight:800;
  font-size:13px;
  margin:2px 0 7px;
}

.caption{
  line-height:1.4;
  font-size:14px;
}

.caption b{
  margin-right:5px;
}

.comments-link{
  color:var(--muted);
  margin-top:8px;
  font-size:13px;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

/* VERIFIED */

.verified-badge{
  display:inline-flex;
  width:17px;
  height:17px;
  margin-left:4px;
  color:#1264ff;
  vertical-align:-3px;
  flex:none;
}

.verified-badge svg{
  width:100%;
  height:100%;
  display:block;
}

.verified-name{
  display:inline-flex;
  align-items:center;
}

.verify-hero{
  text-align:center;
  padding:25px 10px 20px;
}

.verify-icon{
  width:82px;
  height:82px;
  margin:0 auto 18px;
  color:#1264ff;
}

.verify-icon svg{
  width:100%;
  height:100%;
}

.verify-account{
  margin-top:18px;
  padding:15px;
  border:1px solid var(--line);
  background:#0b1118;
  border-radius:15px;
  text-align:left;
}

.verify-account-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.verify-account-name{
  font-size:16px;
  font-weight:800;
}

.verify-progress{
  margin-top:18px;
  height:7px;
  background:#17212d;
  border-radius:99px;
  overflow:hidden;
}

.verify-progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#1264ff,#3180ff);
  border-radius:99px;
  transition:width .5s ease;
}

.verify-status{
  margin-top:13px;
  min-height:20px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:70px;
  background:rgba(8,12,18,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  background:transparent;
  color:#7d8998;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:4px;
  font-size:10px;
}

.nav-btn.active{
  color:#fff;
}

.nav-btn.active .icon{
  color:var(--blue);
}

.nav-btn .icon{
  width:21px;
  height:21px;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:14px;
}

.search-box .icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-box input{
  padding-left:43px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 4px;
}

.user-row-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.user-row-main{
  flex:1;
  min-width:0;
}

.user-row-name{
  font-weight:800;
}

.user-row-username{
  color:var(--muted);
  font-size:13px;
}

/* PROFILE */

.profile-head{
  padding:20px 16px;
}

.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.profile-main{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:20px;
  font-weight:900;
}

.profile-username{
  color:var(--muted);
  margin-top:3px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.stat{
  text-align:center;
}

.stat-number{
  font-weight:900;
  font-size:17px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.profile-bio{
  margin-top:16px;
  line-height:1.45;
  white-space:pre-wrap;
}

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.profile-buttons .btn{
  flex:1;
}

.grid-posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.grid-item{
  aspect-ratio:1;
  background:#0e151d;
  overflow:hidden;
  position:relative;
}

.grid-item img,
.grid-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-mark{
  position:absolute;
  top:8px;
  right:8px;
  width:25px;
  height:25px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
}

/* CREATE */

.create-preview{
  margin-top:14px;
  border-radius:16px;
  overflow:hidden;
  background:#05080c;
}

.create-preview img,
.create-preview video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain;
}

.file-picker{
  position:relative;
  border:1px dashed #344354;
  border-radius:15px;
  padding:20px;
  text-align:center;
  background:#0b1118;
}

.file-picker input{
  width:100%;
}

/* SETTINGS */

.settings-section{
  margin-top:20px;
}

.settings-title{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  margin:0 0 8px 4px;
}

.settings-card{
  overflow:hidden;
}

.setting-row{
  width:100%;
  min-height:57px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 14px;
  background:transparent;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#151f2b;
}

.setting-content{
  flex:1;
}

.setting-name{
  font-weight:700;
  font-size:14px;
}

.setting-desc{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.chevron{
  color:#657384;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#0d141d;
  border:1px solid var(--line);
  border-radius:22px 22px 0 0;
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-title{
  font-weight:900;
  font-size:19px;
}

/* COMMENTS */

.comment{
  display:flex;
  gap:9px;
  margin-bottom:14px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.comment-body{
  flex:1;
  background:#121a24;
  padding:9px 11px;
  border-radius:12px;
}

.comment-user{
  font-weight:800;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
  font-size:13px;
  line-height:1.4;
}

/* CHAT */

.chat-list{
  padding:4px 0;
}

.chat-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line);
}

.chat-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
}

.chat-main{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:800;
}

.chat-preview{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.messages{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:7px;
  min-height:calc(100vh - 145px);
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:15px;
  font-size:14px;
  line-height:1.4;
}

.message.mine{
  align-self:flex-end;
  background:var(--blue);
  border-bottom-right-radius:4px;
}

.message.theirs{
  align-self:flex-start;
  background:#151e29;
  border-bottom-left-radius:4px;
}

.chat-input{
  position:fixed;
  bottom:70px;
  left:0;
  right:0;
  background:#0a1017;
  border-top:1px solid var(--line);
  padding:9px;
  display:flex;
  gap:7px;
  z-index:80;
}

.chat-input input{
  flex:1;
}

/* REELS */

.reels{
  height:calc(100vh - 62px - 70px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:#000;
}

.reel{
  height:100%;
  min-height:100%;
  scroll-snap-align:start;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.reel-info{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  z-index:3;
  text-shadow:0 2px 8px #000;
}

.reel-user{
  font-weight:900;
  margin-bottom:7px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:1000;
  background:#151e29;
  border:1px solid #2a3849;
  padding:11px 15px;
  border-radius:12px;
  font-size:13px;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* STORY VIEW */

.story-view{
  position:fixed;
  inset:0;
  z-index:900;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-view img,
.story-view video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.story-top{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
}

.story-top .avatar{
  width:38px;
  height:38px;
}

.story-top-info{
  flex:1;
}

.story-close{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
}

.story-bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:25px;
  z-index:5;
  display:flex;
  gap:8px;
}

.story-bottom input{
  flex:1;
}

@media(min-width:700px){
  .bottom{
    max-width:720px;
    left:50%;
    transform:translateX(-50%);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
}
</style>
</head>

<script>

const SUPABASE_URL = "https://mfigwskkkeiakqfstrvv.supabase.co";
const SUPABASE_KEY = "sb_publishable_jIhgKUo_Z_a-dUvmTaYsdQ_JnFhOy7P";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const app = document.getElementById("app");

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let currentChatId = null;
let currentChatUser = null;
let currentProfileUser = null;
let currentStory = null;
let realtimeChannels = [];

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el = $("toast");
  if(!el) return;

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast = setTimeout(
    () => el.classList.remove("show"),
    2500
  );
}

function timeAgo(date){
  const diff = Date.now() - new Date(date).getTime();

  const m = Math.floor(diff / 60000);

  if(m < 1) return "сейчас";

  if(m < 60) return m + " мин";

  const h = Math.floor(m / 60);

  if(h < 24) return h + " ч";

  const d = Math.floor(h / 24);

  if(d < 7) return d + " д";

  return new Date(date).toLocaleDateString("ru-RU");
}

function getAvatar(profile){
  return profile?.avatar_url ||

async function login(){

  const email = $("authEmail")?.value.trim();
  const password = $("authPassword")?.value;

  if(!email || !password){
    $("authError").textContent =
      "Заполни email и пароль";
    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    $("authError").textContent =
      error.message;
    return;
  }

  currentUser = data.user;

  await loadProfile();

  saveAccountSession();

  await showHome();
}

async function register(){

  const email =
    $("authEmail")?.value.trim();

  const password =
    $("authPassword")?.value;

  const usernameRaw =
    $("authUsername")?.value.trim().toLowerCase();

  const display =
    $("authDisplay")?.value.trim();

  const username =
    usernameRaw
      .replace(/^@/,"")
      .replace(/[^a-z0-9_.]/g,"");

  if(!email || !password || !username){
    $("authError").textContent =
      "Заполни обязательные поля";
    return;
  }

  if(username.length < 3){
    $("authError").textContent =
      "Username должен быть минимум 3 символа";
    return;
  }

  if(password.length < 6){
    $("authError").textContent =
      "Пароль должен быть минимум 6 символов";
    return;
  }

  const {data,error} =
    await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          username,
          display_name:display || username
        }
      }
    });

  if(error){
    $("authError").textContent =
      error.message;
    return;
  }

  if(data.user){

    currentUser = data.user;

    await loadProfile();

    if(!currentProfile){

      await db.from("profiles").upsert({
        id:data.user.id,
        username,
        display_name:display || username
      });

      await loadProfile();
    }

    toast("Аккаунт создан");

    saveAccountSession();

    await showHome();
  }
}

async function loadProfile(){

  if(!currentUser) return null;

  const {data,error} =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return null;
  }

  currentProfile = data;

  return data;
}

/* =========================================================
   ACCOUNT MANAGER
========================================================= */

const ACCOUNTS_KEY =
  "maxnet_accounts_v1";

function getSavedAccounts(){

  try{
    return JSON.parse(
      localStorage.getItem(ACCOUNTS_KEY) || "[]"
    );
  }catch{
    return [];
  }
}

function saveAccountSession(){

  if(!currentUser) return;

  db.auth.getSession().then(({data})=>{

    const session = data.session;

    if(!session) return;

    const accounts =
      getSavedAccounts();

    const item = {
      user_id:currentUser.id,
      email:currentUser.email || "",
      username:currentProfile?.username || "",
      display_name:currentProfile?.display_name || "",
      avatar_url:currentProfile?.avatar_url || "",
      access_token:session.access_token,
      refresh_token:session.refresh_token
    };

    const filtered =
      accounts.filter(
        a => a.user_id !== item.user_id
      );

    filtered.unshift(item);

    localStorage.setItem(
      ACCOUNTS_KEY,
      JSON.stringify(filtered.slice(0,7))
    );
  });
}

async function switchAccount(userId){

  const account =
    getSavedAccounts()
      .find(a => a.user_id === userId);

  if(!account) return;

  const {error} =
    await db.auth.setSession({
      access_token:account.access_token,
      refresh_token:account.refresh_token
    });

  if(error){
    toast("Сессия устарела");
    return;
  }

  const {data} =
    await db.auth.getUser();

  if(data.user){

    currentUser = data.user;

    await loadProfile();

    await showHome();
  }
}

async function loadFeed(){

  const feed = $("feed");

  if(!feed) return;

  const {data:posts,error} =
    await db
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url,
          is_verified
        ),
        post_media(
          id,
          media_url,
          media_type,
          sort_order
        )
      `)
      .order("created_at",{ascending:false})
      .limit(50);

  if(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty">
        Не удалось загрузить публикации
      </div>`;

    return;
  }

  if(!posts?.length){

    feed.innerHTML = `
      <div class="empty">

        <div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:7px">
          Пока нет публикаций

          Создай первую публикацию.

    `;

    return;
  }

  feed.innerHTML =
    posts.map(renderPost).join("");
}

  const mediaHtml =
    first.media_type === "video"

    ? `

        src="${esc(first.media_url)}"
        controls
        playsinline

    `

    : `
      <img
        src="${esc(first.media_url)}"
        loading="lazy">
    `;

  return `

    <article
      class="post"
      id="post-${post.id}">

      <div class="post-head">

        <img
          class="post-avatar"
          src="${esc(getAvatar(profile))}"

            @${esc(profile?.username || "")}

        ${mediaHtml}

      <div class="post-actions">

          ${icon("heart")}
        </button>

        <button
          class="action"
          onclick="openComments('${post.id}')">
          ${icon("comment")}
        </button>

        <button
          class="action"
          onclick="sharePost('${post.id}')">
          ${icon("send")}
        </button>

        <button
          class="action"
          onclick="toggleSave('${post.id}',this)">
          ${icon("bookmark")}
        </button>

      </div>

      <div class="post-info">

        <div class="likes">
          ${Number(post.likes_count || 0)}
          отметок нравится
        </div>

        ${post.caption ? `

          <div class="caption">

            <b>
              @${esc(profile?.username || "")}
            </b>

            ${esc(post.caption)}

          </div>

        ` : ""}

        ${Number(post.comments_count || 0) > 0 ? `

async function loadStories(){

  const box = $("stories");

  if(!box) return;

  const now =
    new Date().toISOString();

  const {data,error} =
    await db
      .from("stories")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url,
          is_verified
        )
      `)
      .gt("expires_at",now)
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    box.innerHTML = `

      <div class="story-item">

        <button
          class="add-story"
          onclick="showCreateStory()">

          ${icon("plus")}

        </button>

        <span class="story-name">
          Ваша история
        </span>

      </div>

    `;

    return;
  }

  const grouped = new Map();

  for(const story of data || []){

    if(!grouped.has(story.user_id)){
      grouped.set(
        story.user_id,
        story
      );
    }
  }

  let html = `

    <div class="story-item">

      <button
        class="add-story"
        onclick="showCreateStory()">

        ${icon("plus")}

      </button>

      <span class="story-name">
        Ваша история
      </span>

    </div>
  `;

  html +=
    [...grouped.values()]
      .map(story=>`

        <div
          class="story-item"
          onclick="openStory('${story.id}')">

          <div class="story-ring">

            <div class="story-inner">

              <img
                class="avatar"
                src="${esc(
                  getAvatar(story.profiles)
                )}">

            </div>

          </div>

          <span class="story-name verified-name">

            ${esc(
              story.profiles?.username ||
              "user"
            )}

            ${verifiedBadge(story.profiles)}

          </span>

        </div>

      `)
      .join("");

  box.innerHTML = html;
}

function previewStory(e){

  const file =
    e.target.files?.[0];

  if(!file) return;

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const url =
    URL.createObjectURL(file);

  const preview =
    $("storyPreview");

  preview.classList.remove("hidden");

  preview.innerHTML =
    isVideo

    toast("Выбери файл");
    return;
  }

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const isImage =
    file.type.startsWith("image/") ||
    ["jpg","jpeg","png","webp"].includes(ext);

  if(!isVideo && !isImage){
    toast("Этот формат не поддерживается");
    return;
  }

  const path =
    `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

  toast("Загрузка...");

  const {error:uploadError} =
    await db.storage
      .from("stories")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type || undefined
        }
      );

  if(uploadError){

    console.error(uploadError);

    toast("Ошибка загрузки");

    return;
  }

  const {data:urlData} =
    db.storage
      .from("stories")
      .getPublicUrl(path);

  const expires =
    new Date(
      Date.now() +
      24*60*60*1000
    ).toISOString();

  const {error} =
    await db
      .from("stories")
      .insert({
        user_id:currentUser.id,
        media_url:urlData.publicUrl,
        media_type:
          isVideo ? "video" : "image",
        expires_at:expires
      });

  if(error){

    console.error(error);

    toast("Ошибка создания истории");

    return;
  }

  toast("История опубликована");

  await showHome();
}

function previewPostFiles(e){

  const files =
    [...(e.target.files || [])];

  const box =
    $("postPreview");

  if(!files.length){

    box.classList.add("hidden");

    return;
  }

  box.classList.remove("hidden");

  box.innerHTML =
    files.map(file=>{

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const isVideo =
        file.type.startsWith("video/") ||
        ["mp4","webm"].includes(ext);

      const url =
        URL.createObjectURL(file);

      return isVideo

        ? `
          <video
            src="${url}"
            controls
            playsinline>
          </video>
        `

        : `
          <img src="${url}">
        `;

    }).join("");
}

function getFileType(file){

  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const isVideo =
    file.type.startsWith("video/") ||
    ["mp4","webm"].includes(ext);

  const isImage =
    file.type.startsWith("image/") ||
    ["jpg","jpeg","png","webp"].includes(ext);

  if(isVideo) return "video";

  if(isImage) return "image";

  return null;
}

async function publishPost(){

  const files =
    [...($("postFile")?.files || [])];

  const caption =
    $("postCaption")?.value.trim() || "";

  if(!files.length){

    toast("Выбери фото или видео");

    return;
  }

  if(files.length > 10){

    toast("Максимум 10 файлов");

    return;
  }

  const types =
    files.map(getFileType);

  if(types.some(x=>!x)){

    toast("Есть неподдерживаемый файл");

    return;
  }

  toast("Создание публикации...");

  const {data:post,error:postError} =
    await db
      .from("posts")
      .insert({
        user_id:currentUser.id,
        caption
      })
      .select()
      .single();

  if(postError){

    console.error(postError);

    toast("Ошибка создания публикации");

    return;
  }

  for(let i=0;i<files.length;i++){

    const file =
      files[i];

    const mediaType =
      types[i];

    const ext =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const path =
      `${currentUser.id}/${post.id}/${crypto.randomUUID()}.${ext}`;

    const {error:uploadError} =
      await db.storage
        .from("posts")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:
              file.type || undefined
          }
        );

    if(uploadError){

      console.error(uploadError);

      await db
        .from("posts")
        .delete()
        .eq("id",post.id);

      toast("Ошибка загрузки файла");

      return;
    }

    const {data:urlData} =
      db.storage
        .from("posts")
        .getPublicUrl(path);

    const {error:mediaError} =
      await db
        .from("post_media")
        .insert({
          post_id:post.id,
          media_url:urlData.publicUrl,
          media_type:mediaType,
          sort_order:i
        });

    if(mediaError){

      console.error(mediaError);

      await db
        .from("posts")
        .delete()
        .eq("id",post.id);

      toast("Ошибка сохранения медиа");

      return;
    }
  }

  toast("Публикация опубликована");

  await showHome();
}

      )

function debounce(fn,delay){

  let timer;

  return (...args)=>{

    clearTimeout(timer);

    timer =
      setTimeout(
        ()=>fn(...args),
        delay
      );
  };
}

async function searchUsers(){

  const raw =
    $("searchInput")?.value.trim();

  if(!raw){

    $("searchResults").innerHTML = "";

    return;
  }

  const q =
    raw
      .replace(/^@/,"")
      .replace(/[%_]/g,"");

  if(!q) return;

  const {data,error} =
    await db
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        is_verified
      `)
      .or(
        `username.ilike.%${q}%,display_name.ilike.%${q}%`
      )
      .limit(30);

  if(error){

    console.error(error);

    return;
  }

  const box =
    $("searchResults");

  if(!data?.length){

    box.innerHTML =
      `<div class="empty">
        Ничего не найдено

    return;

  box.innerHTML =
    data.map(p=>`

async function saveProfile(){

  let username =
    $("editUsername")
      ?.value
      .trim()
      .toLowerCase();

  username =
    username
      .replace(/^@/,"")
      .replace(/[^a-z0-9_.]/g,"");

  const display =
    $("editDisplay")?.value.trim();

  const bio =
    $("editBio")?.value.trim();

  const avatar =
    $("avatarFile")
      ?.files?.[0];

  if(username.length < 3){

    toast("Username слишком короткий");

    return;
  }

  let avatarUrl =
    currentProfile?.avatar_url ||
    null;

  if(avatar){

    const ext =
      avatar.name
        .split(".")
        .pop()
        .toLowerCase() ||
      "jpg";

    const path =
      `${currentUser.id}/avatar.${ext}`;

    const {error:uploadError} =
      await db.storage
        .from("avatars")
        .upload(
          path,
          avatar,
          {
            upsert:true,
            contentType:
              avatar.type ||
              "image/jpeg"
          }
        );

    if(uploadError){

      console.error(uploadError);

      toast("Ошибка аватара");

      return;
    }

    const {data:urlData} =
      db.storage
        .from("avatars")
        .getPublicUrl(path);

    avatarUrl =
      urlData.publicUrl +
      "?v=" +
      Date.now();
  }

  const {error} =
    await db
      .from("profiles")
      .update({
        username,
        display_name:
          display || username,
        bio,
        avatar_url:avatarUrl,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        currentUser.id
      );

  if(error){

    console.error(error);

    toast("Ошибка сохранения");

    return;
  }

  await loadProfile();

  saveAccountSession();

  toast("Профиль сохранён");

  await showProfile(
    currentUser.id
  );
}

          </div>

        </div>

      </section>

    `).join("");

  const videos =
    $("reels")
      .querySelectorAll("video");

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          if(entry.isIntersecting){

  const input =
    $("messageInput");

  const content =
    input?.value.trim();

  if(!content || !currentChatId)
    return;

  const {error} =
    await db
      .from("messages")
      .insert({
        chat_id:currentChatId,
        sender_id:currentUser.id,
        content,
        media_type:null
      });

  if(error){

    console.error(error);

    toast("Не удалось отправить");

    return;
  }

  input.value = "";

  await loadMessages();
}

async function startVerification(){

  const button =
    $("verifyButton");

  const process =
    $("verifyProcess");

  const bar =
    $("verifyProgressBar");

  const status =
    $("verifyStatus");

  if(
    !button ||
    !process ||
    !bar ||
    !status
  ) return;

  button.disabled = true;
  button.style.opacity = ".55";

  process.classList.remove("hidden");

  const steps = [

    [
      "Проверяем аккаунт...",
      15
    ],

    [
      "Проверяем профиль...",
      35
    ],

    [
      "Проверяем данные MAXNET...",
      58
    ],

    [
      "Активируем Verified...",
      82
    ]

  ];

  for(const [text,percent] of steps){

    status.textContent =
      text;

    bar.style.width =
      percent + "%";

    await new Promise(
      resolve =>
        setTimeout(resolve,700)
    );
  }

  const {data,error} =
    await db.rpc(
      "claim_verified"
    );

  if(error || data !== true){

    console.error(error);

    status.textContent =
      "Не удалось активировать Verified.";

    bar.style.width =
      "0%";

    button.disabled =
      false;

    button.style.opacity =
      "1";

    toast(
      "Ошибка активации Verified"
    );

    return;
  }

  bar.style.width =
    "100%";

  status.textContent =
    "Verified успешно активирован";

  await loadProfile();

  saveAccountSession();

  await new Promise(
    resolve =>
      setTimeout(resolve,700)
  );

  toast(
    "MAXNET Verified активирован"
  );

  await showProfile(
    currentUser.id
  );
}

                  )}

                  ${verifiedBadge(
                    n.actor
                  )}

                </div>

                <div class="user-row-username">

                  ${text}
                  ·
                  ${timeAgo(n.created_at)}

                </div>

              </div>

            </div>
          `;

        }).join("")

        : `

          <div class="empty">
            Пока нет уведомлений.
          </div>

        `
      }

    </div>
  `;

  document.body.appendChild(modal);

  await db
    .from("notifications")
    .update({
      is_read:true
    })
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );
}

async function openNotification(
  type,
  postId,
  storyId
){

  $("notificationsModal")
    ?.remove();

  if(
    type==="story_like" &&
    storyId
  ){

    await openStory(storyId);

    return;
  }

  if(
    type==="post_like" &&
    postId
  ){

    await showHome();

    setTimeout(()=>{

      document
        .getElementById(
          "post-"+postId
        )
        ?.scrollIntoView({
          behavior:"smooth"
        });

    },300);
  }
}

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

  realtimeChannels.forEach(c=>{

    try{
      db.removeChannel(c);
    }catch{}

  });

  realtimeChannels = [];

  const feedChannel =
    db.channel("maxnet-feed");

  feedChannel

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      ()=>{

        if(currentPage==="home"){
          loadFeed();
        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"post_likes"
      },
      ()=>{

        if(currentPage==="home"){
          loadFeed();
        }

      }
    )

    .subscribe();

  realtimeChannels.push(
    feedChannel
  );

  const messageChannel =
    db.channel("maxnet-messages");

  messageChannel

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{

        if(
          currentChatId &&
          payload.new.chat_id ===
          currentChatId
        ){

          loadMessages();
        }

      }
    )

    .subscribe();

  realtimeChannels.push(
    messageChannel
  );
}

/* =========================================================
   NAVIGATION
========================================================= */

function goBack(){

  if(currentPage==="settings"){

    showProfile(
      currentUser.id
    );

    return;
  }

  if(currentPage==="create"){

    showHome();

    return;
  }

  if(currentPage==="search"){

    showHome();

    return;
  }

  showHome();
}

/* =========================================================
   SESSION INIT
========================================================= */

async function init(){

  const {data} =
    await db.auth.getSession();

  if(data.session?.user){

    currentUser =
      data.session.user;

    await loadProfile();

    if(!currentProfile){

      const username =
        currentUser
          .user_metadata
          ?.username ||
        (
          "user_" +
          currentUser.id.slice(0,8)
        );

      await db
        .from("profiles")
        .upsert({
          id:currentUser.id,
          username,
          display_name:
            currentUser
              .user_metadata
              ?.display_name ||
            username
        });

      await loadProfile();
    }

    saveAccountSession();

    await showHome();

  }else{

    authScreen("login");
  }

  db.auth.onAuthStateChange(
    async(event,session)=>{

      if(event==="SIGNED_OUT"){

        currentUser = null;

        currentProfile = null;

        authScreen("login");
      }

      if(
        event==="TOKEN_REFRESHED" &&
        session
      ){

        saveAccountSession();
      }

    }
  );
}

init();
</script>

<script id="maxnet-enhancements-script">
(function(){
  "use strict";

  const MAX = {
    icons:{
      more:'<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>',

      archive:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M3 4h18v3H3z"/><path d="M9 12h6"/></svg>',
      users:'<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.8M18 14c2 .8 3 2.4 3 5"/></svg>',
      location:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
      music:'<svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>',
      message:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4z"/></svg>',
      edit:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/><path d="m13 7 4 4"/></svg>'
    }
  };

  function esc2(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
  function icon2(n){return (typeof icon==='function'&&icon(n))||MAX.icons[n]||''}
  function isMine(p){return !!currentUser&&p&&p.user_id===currentUser.id}
  function profileName(p){return p?.display_name||p?.username||'Пользователь'}

  /* ---------- SVG icons ---------- */
  window.maxnetExtraIcon=function(n){return icon2(n)};

  /* ---------- Multi-media renderer ---------- */
  window.maxRenderPostMedia=function(post){
    const media=(post.post_media||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    if(!media.length)return '';
    if(media.length===1){
      const m=media[0];
      return `<div class="max-media"><div class="max-media-track">${m.media_type==='video'?`<div class="max-media-slide"><video src="${esc2(m.media_url)}" controls playsinline preload="metadata"></video></div>`:`<div class="max-media-slide"><img src="${esc2(m.media_url)}" loading="lazy"></div>`}</div></div>`;
    }
    return `<div class="max-media"><div class="max-media-track" onscroll="maxMediaScroll(this)">${media.map(m=>`<div class="max-media-slide">${m.media_type==='video'?`<video src="${esc2(m.media_url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc2(m.media_url)}" loading="lazy">`}</div>`).join('')}</div><div class="max-media-count">1/${media.length}</div><div class="max-media-dots">${media.map((_,i)=>`<i class="max-media-dot ${i===0?'active':''}"></i>`).join('')}</div></div>`;
  };
  window.maxMediaScroll=function(track){
    const wrap=track.parentElement; const slides=track.children.length||1; const i=Math.round(track.scrollLeft/(track.clientWidth||1));
    const count=wrap.querySelector('.max-media-count'); if(count)count.textContent=(i+1)+'/'+slides;
    wrap.querySelectorAll('.max-media-dot').forEach((d,n)=>d.classList.toggle('active',n===i));
  };

  /* ---------- Post actions ---------- */
  window.maxPostLink=function(id){return location.href.split('#')[0]+'#post-'+encodeURIComponent(id)};
  window.maxCopyPostLink=async function(id){try{await navigator.clipboard.writeText(maxPostLink(id));toast('Ссылка скопирована')}catch{toast(maxPostLink(id))}};
  window.maxNativeShare=async function(id){const url=maxPostLink(id);try{if(navigator.share)await navigator.share({title:'MAXNET',text:'Публикация в MAXNET',url});else await navigator.clipboard.writeText(url);toast(navigator.share?'':'Ссылка скопирована')}catch{}}

  window.maxCloseSheet=function(){document.querySelectorAll('.max-post-menu,.max-share-sheet,.max-modal').forEach(x=>x.remove())};

  window.maxOpenShare=function(id){
    maxCloseSheet();
    const el=document.createElement('div');el.className='max-share-sheet';
    el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><button onclick="maxSendPost('${id}')">${icon2('send')}<span>Отправить в MAXNET</span></button><button onclick="maxCopyPostLink('${id}');maxCloseSheet()">${MAX.icons.link}<span>Копировать ссылку</span></button><button onclick="maxNativeShare('${id}');maxCloseSheet()">${MAX.icons.share}<span>Поделиться через телефон</span></button><button onclick="maxCloseSheet()"><span>Закрыть</span></button></div>`;
    el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el);
  };

  window.maxOpenPostMenu=async function(id){
    maxCloseSheet();
    const post=await maxGetPost(id); if(!post)return;
    const mine=isMine(post);
    const el=document.createElement('div');el.className='max-post-menu';
    el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div>${mine?`<button onclick="maxEditPost('${id}')">${MAX.icons.edit}<span>Редактировать публикацию</span></button><button onclick="maxArchivePost('${id}')">${MAX.icons.archive}<span>В архив</span></button><button class="danger" onclick="maxDeletePost('${id}')">${MAX.icons.trash}<span>Удалить</span></button>`:''}<button onclick="maxOpenShare('${id}')">${MAX.icons.share}<span>Поделиться</span></button><button onclick="maxCopyPostLink('${id}');maxCloseSheet()">${MAX.icons.link}<span>Копировать ссылку</span></button><button onclick="maxSendPost('${id}')">${icon2('send')}<span>Отправить в личные сообщения</span></button><button onclick="maxCloseSheet()"><span>Закрыть</span></button></div>`;
    el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el);
  };

  async function maxGetPost(id){
    const {data,error}=await db.from('posts').select(`*,profiles:user_id(id,username,display_name,avatar_url,is_verified),post_media(id,media_url,media_type,sort_order)`).eq('id',id).maybeSingle();
    if(error){console.error(error);toast('Не удалось загрузить публикацию');return null} return data;
  }

  window.maxDeletePost=async function(id){
    if(!confirm('Удалить публикацию?'))return;
    const {error}=await db.from('posts').delete().eq('id',id).eq('user_id',currentUser.id);
    if(error){console.error(error);toast('Не удалось удалить публикацию');return}
    maxCloseSheet();toast('Публикация удалена');if(typeof loadFeed==='function')await loadFeed();
  };

  window.maxArchivePost=function(id){
    const key='maxnet_archived_posts';const a=JSON.parse(localStorage.getItem(key)||'[]');if(!a.includes(id))a.push(id);localStorage.setItem(key,JSON.stringify(a));maxCloseSheet();document.getElementById('post-'+id)?.remove();toast('Публикация скрыта в архиве на этом устройстве');
  };

  window.maxEditPost=async function(id){
    const p=await maxGetPost(id);if(!p)return;maxCloseSheet();
    const el=document.createElement('div');el.className='max-modal';el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><div style="font-size:18px;font-weight:900">Редактировать публикацию</div><textarea id="maxEditCaption" class="textarea max-edit-caption">${esc2(p.caption||'')}</textarea><button class="btn primary full" onclick="maxSaveEditPost('${id}')">Сохранить</button><div style="height:8px"></div><button onclick="maxCloseSheet()">Отмена</button></div>`;el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el);
  };
  window.maxSaveEditPost=async function(id){const caption=document.getElementById('maxEditCaption')?.value.trim()||'';const {error}=await db.from('posts').update({caption}).eq('id',id).eq('user_id',currentUser.id);if(error){console.error(error);toast('Ошибка изменения');return}maxCloseSheet();toast('Публикация изменена');if(currentPage==='home')loadFeed()};

  /* ---------- Direct send ---------- */
  window.maxSendPost=async function(postId){
    maxCloseSheet();
    if(typeof showChats==='function'){
      currentPage='chats';
      await showChats();
      setTimeout(()=>maxOpenSendPicker(postId),100);
    }
  };
  window.maxOpenSendPicker=function(postId){
    const el=document.createElement('div');el.className='max-modal';el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><div style="font-size:18px;font-weight:900">Отправить публикацию</div><input id="maxSendSearch" class="input" placeholder="Поиск @username" oninput="maxSearchSendUsers(this.value,'${postId}')"><div id="maxSendUsers" style="margin-top:10px;max-height:45vh;overflow:auto"><div class="max-empty-state">Начни вводить username</div></div><button onclick="maxCloseSheet()">Отмена</button></div>`;el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el)};
  let sendTimer;
  window.maxSearchSendUsers=function(q,postId){clearTimeout(sendTimer);sendTimer=setTimeout(async()=>{const box=document.getElementById('maxSendUsers');if(!box)return;if(!q.trim()){box.innerHTML='<div class="max-empty-state">Начни вводить username</div>';return}const {data}=await db.from('profiles').select('id,username,display_name,avatar_url,is_verified').ilike('username','%'+q.replace(/^@/,'')+'%').limit(20);box.innerHTML=(data||[]).filter(x=>x.id!==currentUser.id).map(u=>`<button class="user-row" style="width:100%;background:transparent;text-align:left" onclick="maxSendToUser('${postId}','${u.id}')"><img class="user-row-avatar" src="${esc2(getAvatar(u))}"><span class="user-row-main"><b>@${esc2(u.username)}</b><small class="muted" style="display:block">${esc2(profileName(u))}</small></span></button>`).join('')||'<div class="max-empty-state">Пользователь не найден</div>'},250)};
  window.maxSendToUser=async function(postId,userId){
    try{
      const {data:chat,error}=await db.rpc('create_direct_chat',{target_user:userId});
      if(error)throw error;
      const chatId=chat?.id||chat?.chat_id||chat;
      if(!chatId)throw new Error('Не получен chat id');
      const {error:me}=await db.from('messages').insert({chat_id:chatId,sender_id:currentUser.id,content:'[MAXNET_POST:'+postId+']'});
      if(me)throw me;maxCloseSheet();toast('Публикация отправлена');
    }catch(e){console.error(e);toast('Не удалось отправить публикацию')}
  };

  /* ---------- Coauthor UI ---------- */
  window.maxCoauthorPicker=function(postId){
    const el=document.createElement('div');el.className='max-modal';el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><div style="font-size:18px;font-weight:900">Добавить соавторов</div><div class="muted small" style="margin:5px 0 12px">Поиск @username → отправить приглашение</div><input id="maxCoSearch" class="input" placeholder="@username" oninput="maxSearchCoauthors(this.value,'${postId}')"><div id="maxCoUsers" style="max-height:45vh;overflow:auto"></div><button onclick="maxCloseSheet()">Готово</button></div>`;el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el)};
  let coTimer;window.maxSearchCoauthors=function(q,postId){clearTimeout(coTimer);coTimer=setTimeout(async()=>{const box=document.getElementById('maxCoUsers');if(!box)return;const term=q.trim().replace(/^@/,'');if(!term){box.innerHTML='';return}const {data}=await db.from('profiles').select('id,username,display_name,avatar_url,is_verified').ilike('username','%'+term+'%').limit(20);box.innerHTML=(data||[]).filter(u=>u.id!==currentUser.id).map(u=>`<button class="user-row" style="width:100%;background:transparent;text-align:left" onclick="maxInviteCoauthor('${postId}','${u.id}')"><img class="user-row-avatar" src="${esc2(getAvatar(u))}"><span class="user-row-main"><b>@${esc2(u.username)}</b><small class="muted" style="display:block">${esc2(profileName(u))}</small></span></button>`).join('')||'<div class="max-empty-state">Не найдено</div>'},250)};
  window.maxInviteCoauthor=async function(postId,userId){
    try{const {error}=await db.from('notifications').insert({user_id:userId,actor_id:currentUser.id,type:'coauthor_invite',post_id:postId});if(error)throw error;toast('Приглашение отправлено')}catch(e){console.error(e);toast('Не удалось отправить приглашение')}
  };

  /* ---------- Replace feed renderer additively ---------- */
  const originalRenderPost=window.renderPost;
  window.renderPost=function(post){
    const profile=post.profiles||{};const media=(post.post_media||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));if(!media.length)return '';
    const archived=JSON.parse(localStorage.getItem('maxnet_archived_posts')||'[]');if(archived.includes(String(post.id)))return '';
    const mediaHtml=maxRenderPostMedia(post);
    return `<article class="post" id="post-${esc2(post.id)}"><div class="post-head"><img class="post-avatar" src="${esc2(getAvatar(profile))}" onclick="showProfile('${post.user_id}')"><div class="post-user" onclick="showProfile('${post.user_id}')"><div class="post-username verified-name">${esc2(profileName(profile))}${verifiedBadge(profile)}</div><div class="post-time">@${esc2(profile.username||'')} · ${timeAgo(post.created_at)}</div></div>${!isMine(post)?`<button class="max-follow" onclick="maxQuickFollow('${post.user_id}',this)">Подписаться</button>`:''}<button class="max-more" onclick="maxOpenPostMenu('${post.id}')">${MAX.icons.more}</button></div>${mediaHtml}<div class="post-actions"><button class="action" onclick="toggleLike('${post.id}',this)">${icon2('heart')}</button><button class="action" onclick="openComments('${post.id}')">${icon2('comment')}</button><button class="action" onclick="maxOpenShare('${post.id}')">${icon2('send')}</button><button class="action" onclick="toggleSave('${post.id}',this)">${icon2('bookmark')}</button></div><button class="max-send-direct" onclick="maxSendPost('${post.id}')">${icon2('send')}Отправить</button><div class="post-info"><div class="likes">${Number(post.likes_count||0)} отметок нравится</div>${post.caption?`<div class="caption"><b>@${esc2(profile.username||'')}</b> ${esc2(post.caption)}</div>`:''}${Number(post.comments_count||0)>0?`<div class="comments-link" onclick="openComments('${post.id}')">Посмотреть комментарии (${post.comments_count})</div>`:''}</div></article>`;
  };

  window.maxQuickFollow=async function(uid,btn){try{const {data}=await db.from('followers').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',uid).maybeSingle();if(data){await db.from('followers').delete().eq('follower_id',currentUser.id).eq('following_id',uid);btn.textContent='Подписаться';btn.classList.remove('following')}else{await db.from('followers').insert({follower_id:currentUser.id,following_id:uid});btn.textContent='Подписки';btn.classList.add('following')}}catch(e){console.error(e);toast('Ошибка подписки')}};

  /* ---------- Bottom nav with Chats ---------- */
  const oldBottomNav=window.bottomNav;
  window.bottomNav=function(){
    const base=oldBottomNav?oldBottomNav():'';
    if(!currentUser)return base;
    const marker='</nav>';if(!base.includes(marker))return base;
    const extra=`<button class="nav-btn max-chat-nav" onclick="showChats()"><span class="max-nav-icon-wrap">${icon2('message')}<span id="maxChatBadge" class="max-unread-dot hidden"></span></span><span>Чаты</span></button>`;
    return base.replace(marker,extra+marker).replace('class="bottom"','class="bottom maxnet-six"');
  };

  /* ---------- Reels ---------- */
  window.showReels=async function(){
    currentPage='reels';
    app.innerHTML=shell(`<div class="max-reels" id="maxReels"><div class="loading">Загрузка Reels...</div></div>`);
    const {data,error}=await db.from('posts').select(`*,profiles:user_id(id,username,display_name,avatar_url,is_verified),post_media(id,media_url,media_type,sort_order)`).order('created_at',{ascending:false}).limit(80);
    if(error){console.error(error);$('maxReels').innerHTML='<div class="empty">Не удалось загрузить Reels</div>';return}
    const rows=[];(data||[]).forEach(p=>(p.post_media||[]).filter(m=>m.media_type==='video').forEach(m=>rows.push({p,m})));if(!rows.length){$('maxReels').innerHTML='<div class="empty">Пока нет Reels</div>';return}
    $('maxReels').innerHTML=rows.map(({p,m})=>{const pr=p.profiles||{};return `<section class="max-reel"><video src="${esc2(m.media_url)}" playsinline loop preload="metadata" onclick="this.paused?this.play():this.pause()"></video><div class="max-reel-shade"></div><div class="max-reel-info"><div class="max-reel-user"><img class="max-reel-avatar" src="${esc2(getAvatar(pr))}" onclick="showProfile('${p.user_id}')"><span class="max-reel-name">@${esc2(pr.username||'')}</span>${verifiedBadge(pr)}${p.user_id!==currentUser.id?`<button class="max-follow" onclick="maxQuickFollow('${p.user_id}',this)">Подписаться</button>`:''}</div><div>${esc2(p.caption||'')}</div><div class="muted small" style="margin-top:7px">${MAX.icons.music} MAXNET audio</div></div><div class="max-reel-actions"><button class="max-reel-action" onclick="toggleLike('${p.id}',this)">${icon2('heart')}</button><button class="max-reel-action" onclick="openComments('${p.id}')">${icon2('comment')}</button><button class="max-reel-action" onclick="maxOpenShare('${p.id}')">${icon2('send')}</button><button class="max-reel-action" onclick="toggleSave('${p.id}',this)">${icon2('bookmark')}</button></div></section>`}).join('');
    const obs=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.65});document.querySelectorAll('.max-reel').forEach(x=>obs.observe(x));
  };

  /* ---------- Stories: extra actions + privacy/local settings ---------- */
  window.maxStoryMenu=function(storyId){
    const el=document.createElement('div');el.className='max-modal';el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><button onclick="maxStoryViewers('${storyId}')">${MAX.icons.users}<span>Кто посмотрел</span></button><button onclick="maxStoryPrivacy()">${MAX.icons.users}<span>Настройки приватности истории</span></button><button class="danger" onclick="maxDeleteStory('${storyId}')">${MAX.icons.trash}<span>Удалить историю</span></button><button onclick="maxCloseSheet()">Закрыть</button></div>`;el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el);
  };
  window.maxDeleteStory=async function(id){if(!confirm('Удалить историю?'))return;const {error}=await db.from('stories').delete().eq('id',id).eq('user_id',currentUser.id);if(error){console.error(error);toast('Ошибка удаления');return}maxCloseSheet();closeStory();toast('История удалена');loadStories()};
  window.maxStoryPrivacy=function(){const cur=localStorage.getItem('maxnet_story_privacy')||'public';const val=prompt('Приватность: public или followers',cur);if(!val)return;if(!['public','followers'].includes(val))return toast('Используй public или followers');localStorage.setItem('maxnet_story_privacy',val);toast('Настройка сохранена')};
  window.maxStoryViewers=async function(id){maxCloseSheet();const {data,error}=await db.from('story_views').select('viewer_id,profiles:viewer_id(username,display_name,avatar_url,is_verified)').eq('story_id',id);if(error){toast('Список просмотров недоступен');return}const el=document.createElement('div');el.className='max-modal';el.innerHTML=`<div class="max-sheet"><div class="max-sheet-grip"></div><div style="font-size:18px;font-weight:900">Просмотры</div><div class="max-story-viewers">${(data||[]).map(x=>`<div class="user-row"><img class="user-row-avatar" src="${esc2(getAvatar(x.profiles))}"><div class="user-row-main"><b>@${esc2(x.profiles?.username||'')}</b><small class="muted" style="display:block">${esc2(profileName(x.profiles))}</small></div></div>`).join('')||'<div class="max-empty-state">Пока никто не посмотрел</div>'}</div><button onclick="maxCloseSheet()">Закрыть</button></div>`;el.onclick=e=>{if(e.target===el)maxCloseSheet()};document.body.appendChild(el)};

  /* ---------- Profile tabs ---------- */
  window.maxShowProfileTab=function(tab,userId){
    if(tab==='posts'){showProfile(userId);return}
    const el=document.getElementById('maxProfileTabContent');if(!el)return;
    if(tab==='saved'){el.innerHTML='<div class="max-empty-state">Сохранённые публикации будут показаны здесь.</div>';return}
    if(tab==='reels'){el.innerHTML='<div class="max-empty-state">Reels пользователя доступны через раздел Reels.</div>';return}
    if(tab==='tagged'){el.innerHTML='<div class="max-empty-state">Отмеченные публикации появятся здесь.</div>';return}
  };

  /* ---------- Avatar upload fix: unique path + cache bust ---------- */
  window.saveProfile=async function(){
    let username=$('editUsername')?.value.trim().toLowerCase().replace(/^@/,'').replace(/[^a-z0-9_.]/g,'');const display=$('editDisplay')?.value.trim();const bio=$('editBio')?.value.trim();const avatar=$('avatarFile')?.files?.[0];if(username.length<3){toast('Username слишком короткий');return}
    let avatarUrl=currentProfile?.avatar_url||null;
    if(avatar){
      if(!avatar.type.startsWith('image/')){toast('Выбери изображение');return}
      const ext=(avatar.name.split('.').pop()||'jpg').toLowerCase();const path=`${currentUser.id}/avatar-${Date.now()}-${crypto.randomUUID()}.${ext}`;
      const {error:up}=await db.storage.from('avatars').upload(path,avatar,{upsert:false,cacheControl:'3600',contentType:avatar.type});
      if(up){console.error(up);toast('Ошибка аватарки: проверь Storage bucket avatars и его INSERT policy');return}
      const {data:u}=db.storage.from('avatars').getPublicUrl(path);avatarUrl=(u?.publicUrl||'')+'?v='+Date.now();
    }
    const {error}=await db.from('profiles').update({username,display_name:display||username,bio,avatar_url:avatarUrl,updated_at:new Date().toISOString()}).eq('id',currentUser.id);if(error){console.error(error);toast('Ошибка сохранения профиля');return}await loadProfile();saveAccountSession();toast('Профиль сохранён');await showProfile(currentUser.id);
  };

  /* ---------- Create page: metadata controls + preview ---------- */
  const oldShowCreate=window.showCreate;
  window.showCreate=function(){
    oldShowCreate();
    setTimeout(()=>{
      const cap=$('postCaption');if(!cap)return;
      const file=$('postFile');if(file){file.setAttribute('accept','image/*,video/*');file.setAttribute('multiple','');}
      const wrap=cap.parentElement?.parentElement;
      if(!document.getElementById('maxPostMeta')){
        const box=document.createElement('div');box.id='maxPostMeta';box.innerHTML=`<div class="max-option-row"><span class="muted">${MAX.icons.users}</span><input id="maxPostTags" class="input" placeholder="Отметить людей: @username"></div><div class="max-option-row"><span class="muted">${MAX.icons.location}</span><input id="maxPostLocation" class="input" placeholder="Место"></div><div class="max-option-row"><span class="muted">#</span><input id="maxPostHashtags" class="input" placeholder="#хэштеги"></div><div class="max-option-row"><input id="maxPostCoauthors" class="input" placeholder="Соавторы: @username"></div><div class="muted small">Фото/видео можно выбрать несколько. Перед публикацией они отображаются в предпросмотре.</div>`;cap.parentNode.insertAdjacentElement('afterend',box)}
    },30);
  };

  /* ---------- Story creation extra controls ---------- */
  const oldShowCreateStory=window.showCreateStory;
  window.showCreateStory=function(){
    oldShowCreateStory();setTimeout(()=>{const box=document.querySelector('#storyPreview')||document.querySelector('.story-preview');const root=document.querySelector('.page');if(root&&!document.getElementById('maxStoryMeta')){const d=document.createElement('div');d.id='maxStoryMeta';d.innerHTML=`<div class="max-option-row"><span class="muted">${MAX.icons.link}</span><input id="maxStoryLink" class="input" placeholder="Ссылка (необязательно)"></div><div class="max-option-row"><span class="muted">${MAX.icons.music}</span><input id="maxStoryMusic" class="input" placeholder="Название музыки/аудио"></div><div class="max-option-row"><span class="muted">#</span><input id="maxStorySticker" class="input" placeholder="Текст стикера"></div>`;root.appendChild(d)}},30)
  };

  /* ---------- Add ••• and story menu to story viewer when it exists ---------- */
  const oldOpenStory=window.openStory;
  window.openStory=async function(storyId){await oldOpenStory(storyId);setTimeout(()=>{const view=document.querySelector('.story-view');if(!view||view.querySelector('.max-story-tools'))return;const t=document.createElement('div');t.className='max-story-tools';t.innerHTML=`<button class="max-story-tool" onclick="maxStoryMenu('${storyId}')">${MAX.icons.more}</button>`;view.appendChild(t)},50)};

  /* ---------- Convenience profile tabs injection ---------- */
  const oldShowProfile=window.showProfile;
  window.showProfile=async function(uid){await oldShowProfile(uid);setTimeout(()=>{const container=document.querySelector('.profile')||document.querySelector('.profile-head')?.parentElement;if(!container||document.getElementById('maxProfileTabs'))return;const target=document.querySelector('.profile-grid')||document.querySelector('.grid');const tabs=document.createElement('div');tabs.id='maxProfileTabs';tabs.className='max-profile-tabs';tabs.innerHTML=`<button class="active" onclick="maxShowProfileTab('posts','${uid}')">Публикации</button><button onclick="maxShowProfileTab('reels','${uid}')">Reels</button><button onclick="maxShowProfileTab('tagged','${uid}')">Отметки</button><button onclick="maxShowProfileTab('saved','${uid}')">Сохранённые</button>`;(target||container).insertAdjacentElement('beforebegin',tabs)},30)};

  /* ---------- Close sheets on browser back / background tap ---------- */
  document.addEventListener('keydown',e=>{if(e.key==='Escape')maxCloseSheet()});

  /* ---------- Make story view reply/share buttons richer without changing DB ---------- */
  const storyObserver=new MutationObserver(()=>{const v=document.querySelector('.story-view');if(!v||v.querySelector('.max-story-tools'))return;const storyId=currentStory?.id;if(!storyId)return;const t=document.createElement('div');t.className='max-story-tools';t.innerHTML=`<button class="max-story-tool" onclick="maxStoryMenu('${storyId}')">${MAX.icons.more}</button>`;v.appendChild(t)});storyObserver.observe(document.body,{childList:true,subtree:true});

  /* ---------- Unread chat + notification indicators ---------- */
  const CHAT_SEEN_KEY='maxnet_chat_seen_';
  const NOTIF_SEEN_INIT_KEY='maxnet_notifications_initialized_';

  function chatSeenKey(){return CHAT_SEEN_KEY+(currentUser?.id||'guest')}
  function getChatSeen(){return Number(localStorage.getItem(chatSeenKey())||0)}
  function setChatSeen(ts=Date.now()){localStorage.setItem(chatSeenKey(),String(ts));setChatBadge(false)}
  function setChatBadge(show){const el=document.getElementById('maxChatBadge');if(el)el.classList.toggle('hidden',!show)}
  function setNotificationBadge(show){const el=document.getElementById('maxNotificationBadge');if(el)el.classList.toggle('hidden',!show)}

  async function updateNotificationBadge(){
    if(!currentUser){setNotificationBadge(false);return}
    const {count,error}=await db.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',currentUser.id).eq('is_read',false);
    if(error){console.error(error);return}
    setNotificationBadge((count||0)>0);
  }

  async function updateChatBadge(){
    if(!currentUser){setChatBadge(false);return}
    try{
      const {data:members,error:me}=await db.from('chat_members').select('chat_id').eq('user_id',currentUser.id);
      if(me||!members?.length){setChatBadge(false);return}
      const ids=members.map(x=>x.chat_id);
      let q=db.from('messages').select('id,created_at,sender_id').in('chat_id',ids).neq('sender_id',currentUser.id).order('created_at',{ascending:false}).limit(1);
      const {data,error}=await q;
      if(error){console.error(error);return}
      const latest=data?.[0];
      if(!latest){setChatBadge(false);return}
      const seen=getChatSeen();
      if(!seen){setChatSeen(new Date(latest.created_at).getTime());return}
      setChatBadge(new Date(latest.created_at).getTime()>seen);
    }catch(e){console.error(e)}
  }

  window.maxClearChatUnread=function(){setChatSeen(Date.now())};

  // Patch showChats so opening the chat list clears its red indicator.
  const _maxShowChats=window.showChats;
  window.showChats=async function(){
    await _maxShowChats();
    setChatSeen(Date.now());
    await updateNotificationBadge();
    setTimeout(updateChatBadge,50);
  };

  // Opening a concrete chat also marks incoming messages as seen.
  const _maxOpenChat=window.openChat;
  window.openChat=async function(){
    await _maxOpenChat();
    setChatSeen(Date.now());
    setTimeout(updateChatBadge,50);
  };

  // Notifications are marked read by the existing function; refresh the dot afterwards.
  const _maxOpenNotifications=window.openNotifications;
  window.openNotifications=async function(){
    await _maxOpenNotifications();
    setNotificationBadge(false);
  };

  // Realtime unread updates. This is additive to the existing realtime listeners.
  const unreadChannel=db.channel('maxnet-unread-indicators');
  unreadChannel
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},payload=>{
      if(payload.new?.user_id===currentUser?.id){setNotificationBadge(true)}
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
      if(payload.new?.sender_id===currentUser?.id)return;
      if(currentChatId && payload.new?.chat_id===currentChatId){return}
      setChatBadge(true);
    })
    .subscribe();

  // Reels: restore the real post_likes state from Supabase after every render.
  async function restoreReelLikeState(){
    if(!currentUser)return;
    const buttons=[...document.querySelectorAll('.max-reel-action[data-like-post]')];
    if(!buttons.length)return;
    const ids=[...new Set(buttons.map(b=>b.dataset.likePost).filter(Boolean))];
    const {data,error}=await db.from('post_likes').select('post_id').eq('user_id',currentUser.id).in('post_id',ids);
    if(error){console.error(error);return}
    const liked=new Set((data||[]).map(x=>x.post_id));
    buttons.forEach(b=>b.classList.toggle('liked',liked.has(b.dataset.likePost)));
  }

  // Wrap the enhanced Reels renderer without removing its existing UI.
  const _maxShowReels=window.showReels;
  window.showReels=async function(){
    await _maxShowReels();
    document.querySelectorAll('.max-reel').forEach(section=>{
      const btn=section.querySelector('.max-reel-action');
      if(btn){btn.dataset.likePost=section.querySelector('video')?.closest('.max-reel')?.dataset?.post||''}
    });
    await restoreReelLikeState();
  };

  // The renderer above has no post id on the section, so add it directly by reading the onclick attribute.
  function normalizeReelLikeButtons(){
    document.querySelectorAll('.max-reel-action').forEach(btn=>{
      if(btn.dataset.likePost)return;
      const m=(btn.getAttribute('onclick')||'').match(/toggleLike\(['"]([^'"]+)['"]/);
      if(m)btn.dataset.likePost=m[1];
    });
  }
  const _restoreAfterReels=restoreReelLikeState;
  restoreReelLikeState=async function(){normalizeReelLikeButtons();return _restoreAfterReels()};

  // Initial state after login/home is rendered.
  setTimeout(()=>{updateNotificationBadge();updateChatBadge()},300);

  /* ---------- Initial enhancement ---------- */
  window.addEventListener('hashchange',()=>{const id=location.hash.replace('#post-','');if(id&&id!==location.hash){document.getElementById('post-'+id)?.scrollIntoView({behavior:'smooth'})}});
})();
</script>

</body>
